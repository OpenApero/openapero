# RRT* baseline -- best-value node on an RRT* tree, yaw planned per viewpoint.
#
# Delta on top of _common.yaml beside it, which the launch file loads first. The yaw planner wraps
# the evaluator at /task_evaluator, where the launch file loads config/tasks/_common.yaml.
layers:

  planning:
    type: "PlanningLayer"
    priority: 0
    replan_num_steps: 5
    max_expansions: 50

    generator:
      type: "RRTStar"

      sample_max_tries: 1000

      min_edge_length: 1.5
      max_edge_length: 3.0
      visualize_edges: false

    evaluator:
      type: "SimpleYawPlanningEvaluator"
      following_evaluator_args: "/task_evaluator"

    path_planner:
      type: "TreeBestValue"
      objective: "expected_gain"
      is_gain_correlated: false
